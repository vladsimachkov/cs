[package]
name = "coldstore-metadata"
description = "ColdStore metadata cluster node (Raft + RocksDB)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "coldstore-metadata"
path = "src/main.rs"

[features]
default = ["metadata-raft-rocksdb"]
metadata-raft = ["dep:openraft"]
metadata-raft-rocksdb = ["metadata-raft", "dep:rocksdb"]

[dependencies]
coldstore-proto = { workspace = true }
coldstore-common = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
config = { workspace = true }

# Default metadata execution path is now persistent Raft-local mode.
# Disable default features only when explicitly embedding with a custom runtime.
# Pinned exactly, not to a range. `"0.10.0-alpha.18"` was a floating caret requirement: cargo's
# prerelease rule (`>=0.10.0-alpha.18, <0.11.0`) silently admitted newer alphas, so a fresh resolve
# moved us to alpha.37 with no manifest diff to review. The roadmap risk table asks for exactly this
# (`Pin exactly (=)`) until MD-07 evaluates a stable openraft.
openraft = { version = "=0.10.0-alpha.37", optional = true }
rocksdb = { version = "0.24", default-features = false, optional = true }
