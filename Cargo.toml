[workspace]
resolver = "2"
members = [
    "crates/proto",
    "crates/common",
    "crates/metadata",
    "crates/gateway",
    "crates/scheduler",
    "crates/cache",
    "crates/tape",
    "crates/node",
    "crates/vtl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Declared MSRV: the oldest toolchain that must build the workspace. It is not the same thing as
# rust-toolchain.toml, which pins the one toolchain we actually build and lint with (1.91.1).
# Nothing in check-safe or CI compiles at the MSRV; what enforces it is cargo's own rust-version
# error whenever a toolchain older than 1.91 tries to build this workspace. Separately, no package
# in the committed lock *declares* a rust-version above 1.91 — that is a declaration check over
# every lock entry (`cargo metadata --format-version 1`, field `packages[].rust_version`), not a
# compile check over platform-specific crates. Raise only with a reason.
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/coldstore"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# gRPC
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# HTTP server (Gateway S3 layer)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1"
hyper = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging and observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time and identity
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Configuration
config = "0.14"

# Streaming
tokio-stream = "0.1"

# Checksum
sha2 = "0.10"

# Internal crates
coldstore-proto = { path = "crates/proto" }
coldstore-common = { path = "crates/common" }
